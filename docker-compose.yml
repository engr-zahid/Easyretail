services:
  postgres:
    image: postgres:16-alpine
    container_name: easyretail-db
    environment:
      POSTGRES_USER: easyretail
      POSTGRES_PASSWORD: easyretail123
      POSTGRES_DB: easyretail_db  # ✅ Correct
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyretail -d easyretail_db"]  # ✅ FIXED: easyretail_db
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: easyretail-app
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://easyretail:easyretail123@postgres:5432/easyretail_db?schema=public  # ✅ postgres (not postgresql)
      JWT_SECRET: your_very_strong_jwt_secret_change_this_in_production
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_volume:/app/backend/uploads

volumes:
  postgres_data:
  uploads_volume: