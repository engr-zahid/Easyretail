version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: easyretail-db-dev
    environment:
      POSTGRES_USER: easyretail
      POSTGRES_PASSWORD: easyretail123
      POSTGRES_DB: easyretail_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - easyretail-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: easyretail-backend-dev
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://easyretail:easyretail123@postgres:5432/easyretail_db
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres
    networks:
      - easyretail-network
    command: sh -c "npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: easyretail-frontend-dev
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - easyretail-network

networks:
  easyretail-network:
    driver: bridge

volumes:
  postgres_data: