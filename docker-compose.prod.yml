version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easyretail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-easyretail_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - web

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: easyretail-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      - db
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - web

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: easyretail-frontend-prod
    restart: unless-stopped
    environment:
      VITE_API_URL: ${FRONTEND_API_URL}
    depends_on:
      - backend
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: easyretail-nginx-prod
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/ssl/private:ro
    restart: unless-stopped
    networks:
      - web

volumes:
  db_data:
  uploads_data:

networks:
  web:
    driver: bridge
