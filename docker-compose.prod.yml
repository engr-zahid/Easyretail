version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: easyretail-backend-prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - easyretail-prod-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`, `/uploads`, `/health`)"
      - "traefik.http.services.backend.loadbalancer.server.port=5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: easyretail-frontend-prod
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=${FRONTEND_API_URL}
    depends_on:
      - backend
    networks:
      - easyretail-prod-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

networks:
  easyretail-prod-network:
    driver: bridge

volumes:
  uploads_data: